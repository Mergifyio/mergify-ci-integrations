extends: .github

shared:
  check_runs: &CheckRuns
    - check-success=ci-gate
  default_review_cond: &DefaultReviewCond
    - "#approved-reviews-by>=2"
    # A reviewer who reads a change and finds it trivial can label it
    # `low risk` and let it merge on their approval alone.
    # low-risk-label-guard.yml strips the label back off when the author adds
    # it, so nobody can halve their own review requirement.
    - and:
        - label = low risk
        - "#approved-reviews-by>=1"
    - author = dependabot[bot]
    - author = renovate[bot]
    - author = mergify-ci-bot

queue_rules:
  - name: default
    queue_conditions:
      - base=main
      - label!=manual merge
    commit_message_format:
      title: pr-title
      body: pr-body
    merge_method: squash

pull_request_rules:
  - name: request review
    conditions:
      - -author=dependabot[bot]
      - -author=renovate[bot]
      - -author=mergify-ci-bot
      - -merged
      - -closed
      - and: *CheckRuns
      - "#changes-requested-reviews-by=0"
      - review-requested!=@devs
      - not:
          or: *DefaultReviewCond
    actions:
      request_reviews:
        teams:
          - devs

merge_protections:
  - name: 🤖 Continuous Integration
    if: []
    success_conditions:
      - and: *CheckRuns

  - name: 👀 Review Requirements
    if: []
    success_conditions:
      - or: *DefaultReviewCond

merge_queue:
  max_parallel_checks: 5

merge_protections_settings:
  reporting_method: deployments
  auto_merge_conditions: true
