[project]
name = "mergify-bench-tools"
version = "0.0.0"
description = "Runs the bench suites and checks what Mergify recorded"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.2"]

[project.scripts]
bench-run-suite = "mergify_bench_tools.run_suite:main"
bench-verify = "mergify_bench_tools.verify:main"

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.14.9",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
