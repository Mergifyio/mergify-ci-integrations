[package]
name = "mergify-ci-node"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Node binding over mergify-ci-core, published as @mergifyio/ci-native."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mergify-ci-api = { path = "../../../../crates/mergify-ci-api" }
mergify-ci-core = { path = "../../../../crates/mergify-ci-core" }
# `async` pulls in napi's tokio runtime, which drives the async API client and
# surfaces its calls to JS as Promises. `napi6` is what gates `BigInt`, needed
# because span timestamps are nanoseconds since the epoch — past what a JS
# `number` holds exactly. Both are far below the N-API 9 that Node >=22 ships.
napi = { version = "3", default-features = false, features = ["async", "napi6"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
