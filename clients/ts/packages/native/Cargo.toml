[package]
name = "mergify-ci-node"
version = "0.0.0"
edition.workspace = true
license = "GPL-3.0-only"
repository.workspace = true
authors.workspace = true
description = "Node binding over mergify-ci-core, published as @mergifyio/ci-native."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mergify-ci-core = { path = "../../../../crates/mergify-ci-core" }
napi = { version = "3", default-features = false }
napi-derive = "3"
serde_json = "1"

[build-dependencies]
napi-build = "2"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
