[package]
name = "mergify_ci"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Ruby binding over mergify-ci-core, compiled into the rspec-mergify gem."
# Underscored, against the hyphens the other crates use: Ruby loads an
# extension by file name and calls `Init_<that name>`, and rb_sys derives both
# from the package name. Crate, lib and extension have to agree.
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mergify-ci-api = { path = "../../../../crates/mergify-ci-api" }
mergify-ci-core = { path = "../../../../crates/mergify-ci-core" }
magnus = "0.8"
# For rb_thread_call_without_gvl, which magnus 0.8 does not wrap. Kept in
# step with the version magnus itself depends on.
rb-sys = "0.9"
# A single-threaded runtime to drive the async client's futures to completion
# from sync Ruby, as the PyO3 binding does for sync Python.
tokio = { version = "1", features = ["rt", "net", "time"] }

[lints]
workspace = true
