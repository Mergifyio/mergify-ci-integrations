[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "pytest-mergify"
version = "0.0.0"
description = "Pytest plugin for Mergify CI Insights"
authors = [{ name = "Julien Danjou", email = "jd@mergify.com" }]
# Relocated from the standalone pytest-mergify repo (MRGFY-7766). Keeps its
# original GPL license; the Rust workspace around it is Apache-2.0.
license = "GPL-3.0-only"
readme = "README.md"
# The bundled Rust binding is abi3-py39, so 3.9 is the floor (was 3.8 upstream).
requires-python = ">=3.9"
# The OpenTelemetry SDK, its OTLP exporter, and `requests` are gone: CI
# detection and the API/trace-upload calls all run through the bundled Rust
# binding now, and spans are built and encoded there too.
dependencies = [
    "pytest>=6.0.0",
    "pytest-timeout>=2.4.0",
]

[project.entry-points.pytest11]
pytest_mergify = "pytest_mergify"

[tool.maturin]
# Mixed project: Python sources live under python/, the compiled extension is
# packaged inside the pytest_mergify package as `_mergify_ci`.
python-source = "python"
module-name = "pytest_mergify._mergify_ci"
features = ["pyo3/extension-module"]

# Relocated from the standalone pytest-mergify repo. The code stays py38-style
# (typing.Dict/List, no `from __future__ import annotations`), so the lint
# target matches even though the wheel floor is 3.9.
[tool.ruff]
target-version = "py38"

[dependency-groups]
dev = [
    "anys>=0.3.1",
    # Decodes the OTLP protobuf the binding uploads, for the collector-based
    # upload tests.
    "opentelemetry-proto>=1.29",
    "freezegun>=1.5.5",
    "pytest-xdist>=3.0",
]
