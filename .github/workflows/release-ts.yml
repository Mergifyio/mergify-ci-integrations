name: Publish ts clients

# The npm half of the publish stage of release.yml (see there for the whole
# flow). The workspace ships four npm packages -- @mergifyio/ci-core, /vitest,
# /playwright, and the /ci-native binding -- plus one prebuilt-binary package
# per platform (@mergifyio/ci-native-<target>). Publishing the draft fires
# this, which pushes the tarballs the draft carries to npm with provenance via
# Trusted Publishing (OIDC, no token). It deliberately does not rebuild: what
# was reviewed on the draft is what reaches the registry, byte for byte. All
# eleven packages carry npmjs.com trusted-publisher settings pointed at this
# repo, THIS workflow file, and the `release` environment -- all three have to
# match or the token exchange 404s, so renaming the file is a breaking change.
#
# Adding a package to the workspace therefore takes one manual step, and it
# cannot be done up front: npm only exposes trusted-publisher settings on a
# package that already exists, so a brand-new name has no OIDC identity for its
# first publish (npm/cli#8544 -- npm has no equivalent of PyPI's pending
# publishers). Bridge that one release with an NPM_TOKEN in the `release`
# environment, exported as NODE_AUTH_TOKEN on the publish step: OIDC is tried
# first and the token covers whatever has no publisher configured yet.
# Provenance is unaffected either way -- it comes from `--provenance` plus
# `id-token: write`, which predate trusted publishing. Then configure the
# publisher and drop the token again.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-ts-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    # Nothing is compiled here any more, so this is far more than the work
    # needs -- but the OIDC exchange can still hang, and that is what the
    # ceiling is for.
    timeout-minutes: 30
    # The `release` environment carries the npm Trusted Publishing identity.
    environment: release
    permissions:
      contents: read # checkout for the pinned pnpm, and read the release assets
      id-token: write # npm Trusted Publishing (OIDC) + provenance
    steps:
      # Only for `packageManager`, which pins pnpm. Nothing is installed or
      # built from this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      # Only release.yml creates releases now, and its tags are the bare
      # version; anything else was cut by hand and has no business on npm.
      - name: Check the tag is a release version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "${TAG}" =~ ^[0-9]{4}\.(1[0-2]|[1-9])\.[1-9][0-9]*$ ]]; then
            echo "::error::tag '${TAG}' is not a <YYYY>.<M>.<N> release"
            exit 1
          fi
      # No `registry-url` equivalent, and none is needed: that input's whole
      # effect here was an .npmrc naming registry.npmjs.org, which is already
      # npm's and pnpm's default, plus an `_authToken` line pointing at
      # NODE_AUTH_TOKEN -- a variable this job stopped setting when it moved to
      # Trusted Publishing. Auth now comes from the OIDC exchange, which sets
      # the token itself at publish time.
      #
      # `runtime: node` also supplies the npm that performs that exchange.
      # `pnpm publish` packs its argument and shells out to `npm publish
      # <tarball> --ignore-scripts`, so npm does the upload either way -- the
      # note #203 left here claiming pnpm carries its own OIDC exchange is
      # wrong. npm has to be >= 11.5.1 for Trusted Publishing to exist at all,
      # which is why ts-v0.3.6 died with ENEEDAUTH against the runner image's
      # npm 10.9.8. Node 24 bundles 11.x, so resolving a runtime here is what
      # keeps that from recurring.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          working-directory: clients/ts
          runtime: node
      - name: Download the tarballs the draft built
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release download "${TAG}" --repo "${REPO}" --pattern '*.tgz' --dir dist
      # The draft stage checked these, but release assets are mutable where a
      # tag is not, so the same assertions run again on what actually came back.
      # Seconds, and it closes the only window between review and upload.
      - name: Check the downloaded contents
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: node .github/scripts/check-ts-packages.mjs dist "${TAG}"
      - name: Publish to npm
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG}"

          # Release assets are mutable in a way the tag is not, so every tarball
          # is checked against the tag it was cut for before anything uploads.
          # This is what replaces rebuilding-from-source as the guarantee that
          # the registry gets what the tag says it does.
          declare -a platform=() workspace=()
          for tgz in dist/*.tgz; do
            manifest="$(tar -xzOf "${tgz}" package/package.json)"
            name="$(jq -r .name <<<"${manifest}")"
            found="$(jq -r .version <<<"${manifest}")"
            if [ "${found}" != "${version}" ]; then
              echo "::error::${tgz##*/} carries ${name}@${found}, expected ${version}"
              exit 1
            fi
            # The napi platform packages are not workspace members, and the
            # loader pins them as exact-version optionalDependencies, so they
            # have to reach the registry first.
            case "${name}" in
              @mergifyio/ci-native-*) platform+=("${tgz}") ;;
              *) workspace+=("${tgz}") ;;
            esac
          done

          # An empty `dist` would otherwise sail through both loops below and
          # report success having published nothing at all.
          if [ "${#platform[@]}" -eq 0 ] || [ "${#workspace[@]}" -eq 0 ]; then
            echo "::error::expected both kinds of tarball, found ${#platform[@]} platform and ${#workspace[@]} workspace"
            exit 1
          fi

          publish_tarball() {
            local tgz="$1" name
            name="$(tar -xzOf "${tgz}" package/package.json | jq -r .name)"
            # Publishing eleven packages is not atomic and a version cannot be
            # republished, so a failure part-way would otherwise strand the
            # earlier packages and leave the release unfinishable -- exactly how
            # ts-v0.3.5 died on the seventh package. Skipping what is already
            # there turns a re-run into a recovery.
            if pnpm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published, skipping"
              return 0
            fi
            pnpm publish "${tgz}" --provenance --access public --no-git-checks
          }

          # The OIDC token exchange reaches two hosts before anything is
          # uploaded, and a hang on either one is a transient failure that
          # arrives looking like a permissions failure. Worth a retry.
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              echo "::warning::attempt ${attempt}/3 failed: $*"
              sleep $((attempt * 15))
            done
            echo "::error::giving up after 3 attempts: $*"
            return 1
          }

          for tgz in "${platform[@]}"; do
            retry publish_tarball "${tgz}"
          done
          for tgz in "${workspace[@]}"; do
            retry publish_tarball "${tgz}"
          done
