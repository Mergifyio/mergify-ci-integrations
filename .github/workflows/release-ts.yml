name: Release ts clients

# Two-step release, the same shape as release-pytest-mergify (see there for the
# full rationale -- the draft stage catches build failures BEFORE anything is
# published, since the repo uses immutable releases).
#
# The workspace ships four npm packages -- @mergifyio/ci-core, /vitest,
# /playwright, and the /ci-native binding -- plus one prebuilt-binary package
# per platform (@mergifyio/ci-native-<target>), built by the reusable
# build-ts-native.yml matrix and distributed into npm/<target>/ with
# `napi artifacts`.
#
# Step 1 -- prepare the draft (`workflow_dispatch`):
#   Resolve the release tag -- validating a supplied one, or bumping the patch
#   of the highest existing ts-v* tag when none is given -- then stamp, build,
#   and pack every package from the current commit and create a DRAFT GitHub
#   Release with the tarballs attached + generated notes.
#
# Step 2 -- publish (`release: published`):
#   The maintainer reviews the draft and publishes it; that fires this stage,
#   which rebuilds everything from the now-created tag and publishes to npm
#   with provenance via Trusted Publishing (OIDC, no token). All eleven
#   packages carry npmjs.com trusted-publisher settings pointed at this repo,
#   this workflow file, and the `release` environment -- all three have to
#   match or the token exchange 404s.
#
#   Adding a package to the workspace therefore takes one manual step, and it
#   cannot be done up front: npm only exposes trusted-publisher settings on a
#   package that already exists, so a brand-new name has no OIDC identity for
#   its first publish (npm/cli#8544 -- npm has no equivalent of PyPI's pending
#   publishers). Bridge that one release with an NPM_TOKEN in the `release`
#   environment, exported as NODE_AUTH_TOKEN on the publish step: OIDC is
#   tried first and the token covers whatever has no publisher configured
#   yet. Provenance is unaffected either way -- it comes from `--provenance`
#   plus `id-token: write`, which predate trusted publishing. Then configure
#   the publisher and drop the token again.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag ts-v<SemVer> (e.g. ts-v0.4.0). Leave empty to auto-bump the patch of the latest ts-v* tag."
        type: string
        required: false
        default: ""
  release:
    types: [published]

permissions: {}

# Serialize runs that could collide on a tag (see release-pytest-mergify).
concurrency:
  group: release-ts-${{ github.event_name }}-${{ inputs.tag || github.event.release.tag_name || 'auto' }}
  cancel-in-progress: false

jobs:
  # ---------------- Step 1: prepare the draft (workflow_dispatch) ----------------
  resolve-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout + read the tag list
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full tag list is needed to find the highest ts-v* tag.
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve the release tag
        id: resolve
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${TAG}" ]; then
            echo "Using explicit tag: ${TAG}"
          else
            # The packages continue the standalone repo's SemVer line, fixed
            # across the workspace; 0.3.1 was the last tag cut there and seeds
            # the bump until a ts-v* tag exists here. Auto only bumps the
            # patch -- pass an explicit tag for a minor or major.
            last="$(git tag -l 'ts-v*' \
              | { grep -E '^ts-v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
              | sort -V \
              | tail -1)"
            base="${last:-ts-v0.3.1}"
            IFS=. read -r major minor patch <<<"${base#ts-v}"
            TAG="ts-v${major}.${minor}.$((patch + 1))"
            echo "Auto-computed tag: ${TAG}"
          fi
          # Final shape check for both paths -- `gh release create` would
          # accept any string, so validation lives here.
          if ! [[ "${TAG}" =~ ^ts-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '${TAG}' must be ts-v<major.minor.patch>"
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

  build-native-draft:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/build-ts-native.yml

  create-draft:
    if: github.event_name == 'workflow_dispatch'
    needs: [resolve-tag, build-native-draft]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
    defaults:
      run:
        working-directory: clients/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          working-directory: clients/ts
          runtime: node
          cache: true
          require-lockfile: true
      # Stamp the in-repo 0.0.0 with the release version; `pnpm pack` rewrites
      # the workspace:* dependency ranges to the stamped version.
      - name: Stamp the version
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: pnpm -r version "${TAG#ts-v}" --no-git-tag-version
      # Build BEFORE assembling: the assembly injects optionalDependencies the
      # lockfile knows nothing about, and `pnpm run` verifies deps against the
      # lockfile first, so it would fail with ERR_PNPM_OUTDATED_LOCKFILE. Only
      # `run`/`exec` do that check -- `pnpm pack` below is unaffected.
      - run: pnpm -r run build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: clients/ts/packages/native/artifacts
          pattern: ts-native-*
      - name: Assemble the platform packages
        working-directory: clients/ts/packages/native
        run: |
          pnpm exec napi artifacts -d artifacts
          # Sync the platform packages to the stamped version, and pin them as
          # optionalDependencies of the loader package (the committed manifest
          # carries none, so the workspace stays resolvable between releases).
          # Both `pnpm exec` calls run while the manifest is still clean; the
          # injection below has to stay last in this step.
          pnpm exec napi version
          node --eval '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.optionalDependencies = Object.fromEntries(
              fs.readdirSync("npm").map((dir) => [
                JSON.parse(fs.readFileSync("npm/" + dir + "/package.json", "utf8")).name,
                pkg.version,
              ]),
            );
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
      # `napi artifacts` populates the platform directories, so the copies have
      # to land after it. Nothing else here depends on them: npm packs a LICENSE
      # from the package directory on its own, no `files` entry required.
      - name: Stage the licenses
        working-directory: ${{ github.workspace }}
        run: .github/scripts/stage-ts-licenses.sh
      - name: Pack the packages
        run: |
          pnpm -r pack --pack-destination "${GITHUB_WORKSPACE}/dist"
          for dir in packages/native/npm/*/; do
            npm pack "./${dir}" --pack-destination "${GITHUB_WORKSPACE}/dist"
          done
      - name: Create the draft release with the tarballs attached
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "${TAG}" \
            --repo "${REPO}" \
            --target "${SHA}" \
            --draft \
            --title "ts clients ${TAG#ts-v}" \
            --generate-notes \
            "${GITHUB_WORKSPACE}"/dist/*.tgz

  # ---------------- Step 2: publish (release: published) ----------------
  build-native-publish:
    # A GitHub Release in this monorepo isn't client-scoped, so only act on
    # ts-v* tags; other clients have their own release workflows.
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'ts-v')
    permissions:
      contents: read
    uses: ./.github/workflows/build-ts-native.yml

  publish:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'ts-v')
    needs: build-native-publish
    runs-on: ubuntu-latest
    # A hang, not an error, is this step's characteristic failure: npm's
    # fetch-timeout is 300s and the retry below can spend it three times per
    # package. Worth bounding well under the 6h default, since a publish that
    # has not finished in half an hour is not going to.
    timeout-minutes: 30
    # The `release` environment carries the npm Trusted Publishing identity.
    environment: release
    permissions:
      contents: read # checkout the tag
      id-token: write # npm Trusted Publishing (OIDC) + provenance
    defaults:
      run:
        working-directory: clients/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      # No `registry-url` equivalent, and none is needed: that input's whole
      # effect here was an .npmrc naming registry.npmjs.org, which is already
      # npm's and pnpm's default, plus an `_authToken` line pointing at
      # NODE_AUTH_TOKEN -- a variable this job stopped setting when it moved to
      # Trusted Publishing. Auth now comes from the OIDC exchange, which sets
      # the token itself at publish time.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          working-directory: clients/ts
          runtime: node
          cache: true
          require-lockfile: true
      - name: Stamp the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: pnpm -r version "${TAG#ts-v}" --no-git-tag-version
      # Same ordering constraint as the draft job -- see the comment there.
      - run: pnpm -r run build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: clients/ts/packages/native/artifacts
          pattern: ts-native-*
      - name: Assemble the platform packages
        working-directory: clients/ts/packages/native
        run: |
          pnpm exec napi artifacts -d artifacts
          pnpm exec napi version
          node --eval '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.optionalDependencies = Object.fromEntries(
              fs.readdirSync("npm").map((dir) => [
                JSON.parse(fs.readFileSync("npm/" + dir + "/package.json", "utf8")).name,
                pkg.version,
              ]),
            );
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
      # `napi artifacts` populates the platform directories, so the copies have
      # to land after it. Nothing else here depends on them: npm packs a LICENSE
      # from the package directory on its own, no `files` entry required.
      - name: Stage the licenses
        working-directory: ${{ github.workspace }}
        run: .github/scripts/stage-ts-licenses.sh
      - name: Publish to npm
        run: |
          # Everything here goes through pnpm, including the napi platform
          # packages. They are not workspace members -- pnpm-workspace.yaml
          # globs `packages/*`, and they live at `packages/native/npm/*` -- so
          # `pnpm -r publish` does not reach them, and they used to be handed to
          # `npm publish` instead. That put a tool nothing pinned in the release
          # path: npm was whatever the runner image shipped, and when the job
          # stopped installing node through actions/setup-node it silently
          # became 10.9.8, which predates Trusted Publishing entirely and failed
          # ts-v0.3.6 with ENEEDAUTH. pnpm is pinned by packageManager, carries
          # its own OIDC exchange, and takes a directory just as happily.
          publish_dir() {
            local dir="$1" name version
            name="$(jq -r .name "${dir}package.json")"
            version="$(jq -r .version "${dir}package.json")"
            # Publishing eleven packages is not atomic and a version cannot be
            # republished, so a failure part-way would otherwise strand the
            # earlier packages and leave the release unfinishable -- exactly how
            # ts-v0.3.5 died on the seventh package. Skipping what is already
            # there turns a re-run into a recovery. Checked explicitly rather
            # than leaning on `pnpm publish`'s own check, so the outcome does
            # not depend on how that reports itself.
            if pnpm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published, skipping"
              return 0
            fi
            pnpm publish "./${dir}" --provenance --access public --no-git-checks
          }

          # The OIDC token exchange reaches two hosts before anything is
          # uploaded, and a hang on either one is a transient failure that
          # arrives looking like a permissions failure. Worth a retry.
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              echo "::warning::attempt ${attempt}/3 failed: $*"
              sleep $((attempt * 15))
            done
            echo "::error::giving up after 3 attempts: $*"
            return 1
          }

          # Platform packages first, so the loader's optionalDependencies
          # never point at not-yet-published versions.
          for dir in packages/native/npm/*/; do
            retry publish_dir "${dir}"
          done
          # pnpm skips workspace packages already on the registry at the
          # version being published, so this half is re-runnable as it stands.
          retry pnpm -r publish --provenance --access public --no-git-checks
