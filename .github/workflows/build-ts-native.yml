name: Build ts native binaries

# Reusable napi-rs matrix that builds the per-platform @mergifyio/ci-native
# binaries and uploads them as `ts-native-<target>` artifacts. Both stages of
# the ts release call it: the draft stage to prove the cross-compile (and
# attach the binaries for review), the publish stage to build what goes to
# npm. The `.node` binaries carry no version stamp, so no tag input is
# needed; each caller's checkout ref is inherited.
#
# The target set matches build-pytest-mergify-wheels.yml (linux/macos x64 +
# arm64, windows x64, and both linux musl archs for alpine, like the
# musllinux wheels). Musl builds follow the napi-rs package template: plain
# runner + zig, `napi build -x` delegating to cargo-zigbuild.
on:
  workflow_call: {}

permissions: {}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest }
          # Cross-compiled from x64: GitHub's hosted arm64 runners are not
          # available on private repos. Pure-Rust crate, so a cross gcc is
          # only needed as the linker.
          - {
              target: aarch64-unknown-linux-gnu,
              runner: ubuntu-latest,
              cross-linker: gcc-aarch64-linux-gnu,
            }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-latest, zig: true }
          - { target: x86_64-apple-darwin, runner: macos-latest }
          - { target: aarch64-apple-darwin, runner: macos-latest }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fetches pnpm as the self-contained native executable for the runner's
      # platform, which is what makes this work on Windows: installed through
      # npm, pnpm 12's `pnpm` bin is a shebang-less sh placeholder that its
      # install script is supposed to replace with pnpm.exe and relink npm's
      # .cmd/.ps1 shims against. When that relinking does not take, the shims
      # still point at a file Windows cannot execute -- and pnpm then does
      # nothing at all, successfully. Downloading the binary skips that dance.
      # It installs the runtime too, so actions/setup-node is gone. `runtime`
      # names node without a version so the version comes from
      # devEngines.runtime in clients/ts/package.json -- naming it is still
      # required, since pnpm/setup installs no runtime at all when the input is
      # absent.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          working-directory: clients/ts
          runtime: node
          cache: true
          require-lockfile: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - name: Install the cross linker
        if: matrix.cross-linker
        run: sudo apt-get update && sudo apt-get install --yes ${{ matrix.cross-linker }}
      # Musl toolchain, the napi-rs package-template way: zig as the cross
      # C compiler/linker, driven by `napi build -x` through cargo-zigbuild.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: matrix.zig
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        if: matrix.zig
        with:
          tool: cargo-zigbuild
      # `pnpm install` is not a step any more: pnpm/setup runs it, frozen, as
      # part of setting the workspace up.
      #
      # The shell stays pinned even though the native binary no longer needs a
      # shell to reach it. The default differs per runner, this step is the one
      # that failed silently when that mattered, and the wheel job pins bash for
      # its own Windows steps too.
      - name: Build the platform binary
        shell: bash
        working-directory: clients/ts/packages/native
        run: pnpm exec napi build --platform --release --target ${{ matrix.target }} ${{ matrix.zig && '-x' || '' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ts-native-${{ matrix.target }}
          path: clients/ts/packages/native/*.node
          if-no-files-found: error
