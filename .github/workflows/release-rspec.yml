name: Publish rspec-mergify

# The RubyGems half of the publish stage of release.yml (see there for the
# whole flow). Publishing the draft fires this, which pushes every gem the
# draft carries -- the seven fat platform gems and the plain `ruby` one -- to
# RubyGems via Trusted Publishing (OIDC, no API key). It deliberately does not
# rebuild: what was reviewed on the draft is what reaches the index, byte for
# byte. RubyGems binds that trust to this repository, THIS workflow filename,
# and the `release` environment -- all three have to match the publisher
# configured on the gem or the token exchange fails, so renaming this file is
# a breaking change.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-rspec-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    # The `release` environment carries the RubyGems Trusted Publishing identity.
    environment: release
    permissions:
      contents: read # checkout for .ruby-version, and read the release assets
      id-token: write # RubyGems Trusted Publishing (OIDC)
    steps:
      # Only for .ruby-version. Nothing is staged or built from this checkout,
      # so stage-rspec-release.sh is not run here -- the gem it staged for is
      # already built and attached to the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      # Only release.yml creates releases now, and its tags are the bare
      # version; anything else was cut by hand and has no business on RubyGems.
      - name: Check the tag is a release version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "${TAG}" =~ ^[0-9]{4}\.(1[0-2]|[1-9])\.[1-9][0-9]*$ ]]; then
            echo "::error::tag '${TAG}' is not a <YYYY>.<M>.<N> release"
            exit 1
          fi
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          working-directory: clients/rspec-mergify
      - name: Download the gems the draft built
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release download "${TAG}" --repo "${REPO}" --dir pkg --pattern '*.gem'

          # Release assets are mutable in a way the tag is not, so every gem is
          # checked against the version the tag names before any of them is
          # pushed. A release now carries a set -- the platform-independent gem
          # plus one per platform -- so the check is that they all belong to
          # this version and the plain one is among them, rather than a count:
          # a platform that failed to build never reaches the draft, since
          # create-draft needs its artifact.
          version="${TAG}"
          shopt -s nullglob
          gems=(pkg/*.gem)
          if [ "${#gems[@]}" -eq 0 ]; then
            echo "::error::no gems attached to ${TAG}"
            exit 1
          fi
          for gem in "${gems[@]}"; do
            case "${gem##*/}" in
              "rspec-mergify-${version}.gem"|"rspec-mergify-${version}-"*.gem) ;;
              *) echo "::error::${gem##*/} is not a ${version} gem"; exit 1 ;;
            esac
          done
          if [ ! -f "pkg/rspec-mergify-${version}.gem" ]; then
            echo "::error::the platform-independent rspec-mergify-${version}.gem is missing"
            exit 1
          fi
          echo "verified ${#gems[@]} gems for ${version}"
      # Replaces rubygems/release-gem, which runs `rake release` and so builds
      # the gem it pushes -- and could only ever push one. This performs the
      # OIDC exchange and writes the credentials, leaving `gem push` below to
      # send the reviewed files. The trust is bound to the workflow identity,
      # not to whichever action performs the exchange, so the publisher
      # configured on the gem is unaffected by the swap.
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push every gem
        run: |
          set -euo pipefail
          # The three registries publish from separate jobs, and eight gems go
          # up one by one, so a failure part-way would otherwise strand the
          # earlier ones: RubyGems refuses a repush. Skipping what is already
          # there turns a re-run of this job into a recovery.
          published="$(curl -fsSL https://rubygems.org/api/v1/versions/rspec-mergify.json \
            | jq -r '.[] | "\(.number)-\(.platform)"')"
          for gem in pkg/*.gem; do
            id="$(ruby -rrubygems/package -e '
              spec = Gem::Package.new(ARGV[0]).spec
              puts "#{spec.version}-#{spec.platform}"' "${gem}")"
            if grep -qxF "${id}" <<<"${published}"; then
              echo "${gem##*/} is already published, skipping"
              continue
            fi
            echo "::group::gem push ${gem}"
            gem push "${gem}"
            echo "::endgroup::"
          done
