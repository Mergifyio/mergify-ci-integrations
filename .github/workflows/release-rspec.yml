name: Release rspec-mergify

# Two-step release, matching pytest-mergify's and the TS workspace's. The gem
# carries a native extension now, so step 1 cross-compiles a fat platform gem
# per target -- one extension per supported Ruby, since Ruby has no stable ABI
# -- plus a plain `ruby` gem for everywhere else. Releases here are immutable,
# so a published release and its tag are frozen and cannot be retried; building
# in step 1 and attaching to the draft means every artifact is proven, and
# reviewable, before anything reaches RubyGems.
#
# Step 1 -- prepare the draft (`workflow_dispatch`):
#   Resolve the release tag -- validating a supplied one, or bumping the patch
#   of the highest existing rspec-mergify-v* tag when none is given -- stamp and
#   build the gem from the current commit, and create a DRAFT GitHub Release
#   with the .gem attached + generated notes. GitHub fires no release events on
#   draft saves, so this stage is dispatch-driven.
#
# Step 2 -- publish (`release: published`):
#   The maintainer reviews the draft and publishes it; that fires this stage,
#   which downloads the .gem the draft attached and pushes that to RubyGems via
#   Trusted Publishing (OIDC, no API key). It deliberately does not rebuild:
#   what was reviewed on the draft is what reaches the index, byte for byte.
#   RubyGems binds that trust to this repository, THIS workflow filename, and
#   the `release` environment -- all three have to match the publisher
#   configured on the gem or the token exchange fails, so renaming this file is
#   a breaking change.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag rspec-mergify-v<SemVer> (e.g. rspec-mergify-v0.1.4). Leave empty to auto-bump the patch of the latest rspec-mergify-v* tag."
        type: string
        required: false
        default: ""
  release:
    types: [published]

permissions: {}

# Serialize runs that could collide on a tag. Empty-tag dispatches share the
# `auto` key so two near-simultaneous runs can't resolve the same version and
# then 422 on a duplicate; explicit-tag and publish runs key off the tag itself.
concurrency:
  group: release-rspec-${{ github.event_name }}-${{ inputs.tag || github.event.release.tag_name || 'auto' }}
  cancel-in-progress: false

jobs:
  # ---------------- Step 1: prepare the draft (workflow_dispatch) ----------------
  resolve-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout + read the tag list
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full tag list is needed to find the highest rspec-mergify-v* tag.
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve the release tag
        id: resolve
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${TAG}" ]; then
            echo "Using explicit tag: ${TAG}"
          else
            # The gem continues the standalone repo's SemVer line. Its tags were
            # bare (0.1.3, no prefix) and don't exist here, so that last release
            # seeds the bump until an rspec-mergify-v* tag exists. Auto only
            # bumps the patch -- pass an explicit tag for a minor or major.
            last="$(git tag -l 'rspec-mergify-v*' \
              | { grep -E '^rspec-mergify-v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
              | sort -V \
              | tail -1)"
            base="${last:-rspec-mergify-v0.1.3}"
            IFS=. read -r major minor patch <<<"${base#rspec-mergify-v}"
            TAG="rspec-mergify-v${major}.${minor}.$((patch + 1))"
            echo "Auto-computed tag: ${TAG}"
          fi
          # Final shape check for both paths -- `gh release create` would accept
          # any string, so validation lives here.
          if ! [[ "${TAG}" =~ ^rspec-mergify-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '${TAG}' must be rspec-mergify-v<major.minor.patch>"
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

  # Nothing here ships Rust sources or compiles on install: the extension
  # path-depends on crates/mergify-ci-core, which only resolves in a full
  # checkout, so the gems are built here exactly as the wheels and the napi
  # packages are. A platform we do not build for falls back to the `ruby` gem,
  # whose loader reports the extension missing and lets detection degrade
  # rather than failing to install.
  build-gems:
    if: github.event_name == 'workflow_dispatch'
    needs: resolve-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - x86_64-linux-musl
          - aarch64-linux
          - aarch64-linux-musl
          - x86_64-darwin
          - arm64-darwin
          - x64-mingw-ucrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: clients/rspec-mergify
          bundler-cache: true
      - name: Stage the release inputs
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: .github/scripts/stage-rspec-release.sh "${TAG}"
      - uses: oxidize-rb/actions/cross-gem@e5f9a49a7812a078584072f6e3f657ad247c8771 # v1.4.4
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: "3.1,3.2,3.3,3.4,4.0"
          working-directory: clients/rspec-mergify
        env:
          # rake-compiler-dock mounts one directory and works in it, both
          # defaulting to the current one. That default is wrong for a
          # monorepo: the crate path-depends on ../../../../crates, which would
          # be outside a mount of the gem directory and vanish inside the
          # container. Mount the repository, work in the gem.
          RCD_MOUNTDIR: ${{ github.workspace }}
          RCD_WORKDIR: ${{ github.workspace }}/clients/rspec-mergify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}
          if-no-files-found: error

  build-ruby-gem:
    if: github.event_name == 'workflow_dispatch'
    needs: resolve-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: clients/rspec-mergify
          bundler-cache: true
      - name: Stage the release inputs
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: .github/scripts/stage-rspec-release.sh "${TAG}"
      - name: Build the platform-independent gem
        working-directory: clients/rspec-mergify
        run: bundle exec rake build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gem-ruby
          path: clients/rspec-mergify/pkg/*.gem
          if-no-files-found: error

  create-draft:
    if: github.event_name == 'workflow_dispatch'
    needs: [resolve-tag, build-gems, build-ruby-gem]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: gem-*
          merge-multiple: true
      - name: Create the draft release with every gem attached
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ls -1 dist/*.gem
          gh release create "${TAG}" \
            --repo "${REPO}" \
            --target "${SHA}" \
            --draft \
            --title "rspec-mergify ${TAG#rspec-mergify-v}" \
            --generate-notes \
            dist/*.gem

  # ---------------- Step 2: publish (release: published) ----------------
  publish:
    # A GitHub Release in this monorepo isn't client-scoped, so only act on
    # rspec-mergify's tags; the other clients have their own release workflows.
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'rspec-mergify-v')
    runs-on: ubuntu-latest
    # The `release` environment carries the RubyGems Trusted Publishing identity.
    environment: release
    permissions:
      contents: read # checkout for .ruby-version, and read the release assets
      id-token: write # RubyGems Trusted Publishing (OIDC)
    steps:
      # Only for .ruby-version. Nothing is staged or built from this checkout,
      # so stage-rspec-release.sh is not run here -- the gem it staged for is
      # already built and attached to the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: clients/rspec-mergify
      - name: Download the gems the draft built
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release download "${TAG}" --repo "${REPO}" --dir pkg --pattern '*.gem'

          # Release assets are mutable in a way the tag is not, so every gem is
          # checked against the version the tag names before any of them is
          # pushed. A release now carries a set -- the platform-independent gem
          # plus one per platform -- so the check is that they all belong to
          # this version and the plain one is among them, rather than a count:
          # a platform that failed to build never reaches the draft, since
          # create-draft needs its artifact.
          version="${TAG#rspec-mergify-v}"
          shopt -s nullglob
          gems=(pkg/*.gem)
          if [ "${#gems[@]}" -eq 0 ]; then
            echo "::error::no gems attached to ${TAG}"
            exit 1
          fi
          for gem in "${gems[@]}"; do
            case "${gem##*/}" in
              "rspec-mergify-${version}.gem"|"rspec-mergify-${version}-"*.gem) ;;
              *) echo "::error::${gem##*/} is not a ${version} gem"; exit 1 ;;
            esac
          done
          if [ ! -f "pkg/rspec-mergify-${version}.gem" ]; then
            echo "::error::the platform-independent rspec-mergify-${version}.gem is missing"
            exit 1
          fi
          echo "verified ${#gems[@]} gems for ${version}"
      # Replaces rubygems/release-gem, which runs `rake release` and so builds
      # the gem it pushes -- and could only ever push one. This performs the
      # OIDC exchange and writes the credentials, leaving `gem push` below to
      # send the reviewed files. The trust is bound to the workflow identity,
      # not to whichever action performs the exchange, so the publisher
      # configured on the gem is unaffected by the swap.
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push every gem
        run: |
          set -euo pipefail
          for gem in pkg/*.gem; do
            echo "::group::gem push ${gem}"
            gem push "${gem}"
            echo "::endgroup::"
          done
