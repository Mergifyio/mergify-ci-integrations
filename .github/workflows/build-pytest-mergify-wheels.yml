name: Build pytest-mergify wheels

# Reusable maturin build: the per-platform abi3 wheels, uploaded as `wheels-*`
# artifacts. No source distribution: maturin would vendor the whole workspace,
# Rust core included, into it. release.yml calls it to build the wheels the
# draft release carries, which the publish stage then uploads unchanged.
#
# With a `version` it stamps that CalVer into pyproject before maturin runs;
# without one it leaves the 0.0.0 placeholder (so a smoke build never looks like
# a release). The caller's checkout ref is inherited, so no explicit ref is
# needed here.
on:
  workflow_call:
    inputs:
      version:
        description: "Release version to stamp (<YYYY>.<M>.<N>); empty leaves 0.0.0."
        type: string
        required: false
        default: ""

permissions: {}

# Let abi3 builds proceed against a CPython newer than the one PyO3 knows about.
env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-26.04, target: x86_64, manylinux: auto }
          # linux-aarch64 (and musllinux-aarch64) build natively on an arm runner
          # rather than cross-compiling: ring's ARM-asm build script needs the C
          # compiler to define `__ARM_ARCH`, which the cross-gcc in the manylinux
          # image does not, so `ring` (via reqwest/rustls) fails to compile. A
          # native runner sidesteps it -- the same fix mergify-cli uses.
          - { platform: linux-aarch64, runner: ubuntu-26.04-arm, target: aarch64, manylinux: auto }
          # musllinux (Alpine/musl) wheels: with no sdist published, a platform
          # without a wheel cannot install pytest-mergify at all.
          - { platform: musllinux-x86_64, runner: ubuntu-26.04, target: x86_64, manylinux: musllinux_1_2 }
          - { platform: musllinux-aarch64, runner: ubuntu-26.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { platform: macos-x86_64, runner: macos-latest, target: x86_64, manylinux: auto }
          - { platform: macos-aarch64, runner: macos-latest, target: aarch64, manylinux: auto }
          - { platform: windows-x64, runner: windows-latest, target: x64, manylinux: auto }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # hatch-vcs is gone under maturin, so the version is a build-time stamp:
      # rewrite the 0.0.0 placeholder to the release CalVer before maturin runs.
      - name: Stamp the version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i.bak -E "s/^version = \"0.0.0\".*/version = \"${VERSION}\"/" clients/pytest-mergify/pyproject.toml
          rm -f clients/pytest-mergify/pyproject.toml.bak
          grep '^version = ' clients/pytest-mergify/pyproject.toml
      # The repo keeps a single LICENSE at its root; copy it next to the
      # package's pyproject so maturin bundles it into the wheel at
      # `.dist-info/licenses/LICENSE` (maturin does not pick up the workspace
      # root on its own).
      - name: Bundle the root LICENSE into the package
        shell: bash
        run: cp LICENSE clients/pytest-mergify/LICENSE
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          # Selects the Linux build container -- `auto` (manylinux) or
          # `musllinux_1_2`, built natively on a per-arch runner; ignored on
          # macOS and Windows.
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --manifest-path clients/pytest-mergify/Cargo.toml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-${{ matrix.platform }}
          path: dist/*.whl
