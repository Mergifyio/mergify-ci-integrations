name: Build pytest-mergify wheels

# Reusable maturin build: the per-platform abi3 wheels plus a source
# distribution, all uploaded as `wheels-*` artifacts. Both stages of the release
# call it: the draft stage to prove the build (and attach the artifacts for
# review), the publish stage to build the artifacts that go to PyPI.
#
# With a `tag` it stamps that CalVer into pyproject before maturin runs; without
# one it leaves the 0.0.0 placeholder (so a smoke build never looks like a
# release). Each caller's checkout ref is inherited -- the dispatch commit for
# the draft, the tag's commit for publish -- so no explicit ref is needed here.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to stamp (pytest-mergify-v<calver>); empty leaves 0.0.0."
        type: string
        required: false
        default: ""

permissions: {}

# Let abi3 builds proceed against a CPython newer than the one PyO3 knows about.
env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto }
          # linux-aarch64 (and musllinux-aarch64) build natively on an arm runner
          # rather than cross-compiling: ring's ARM-asm build script needs the C
          # compiler to define `__ARM_ARCH`, which the cross-gcc in the manylinux
          # image does not, so `ring` (via reqwest/rustls) fails to compile. A
          # native runner sidesteps it -- the same fix mergify-cli uses.
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          # musllinux (Alpine/musl) wheels, so musl users get a prebuilt binary
          # instead of falling back to compiling the sdist.
          - { platform: musllinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { platform: musllinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { platform: macos-x86_64, runner: macos-latest, target: x86_64, manylinux: auto }
          - { platform: macos-aarch64, runner: macos-latest, target: aarch64, manylinux: auto }
          - { platform: windows-x64, runner: windows-latest, target: x64, manylinux: auto }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # hatch-vcs is gone under maturin, so the version is a build-time stamp:
      # rewrite the 0.0.0 placeholder to the tag's CalVer before maturin runs.
      - name: Stamp the version from the tag
        if: inputs.tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#pytest-mergify-v}"
          sed -i.bak -E "s/^version = \"0.0.0\".*/version = \"${version}\"/" clients/pytest-mergify/pyproject.toml
          rm -f clients/pytest-mergify/pyproject.toml.bak
          grep '^version = ' clients/pytest-mergify/pyproject.toml
      # The repo keeps a single LICENSE at its root; copy it next to the
      # package's pyproject so maturin bundles it into the wheel at
      # `.dist-info/licenses/LICENSE` (maturin does not pick up the workspace
      # root on its own).
      - name: Bundle the root LICENSE into the package
        shell: bash
        run: cp LICENSE clients/pytest-mergify/LICENSE
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          # Selects the Linux build container -- `auto` (manylinux) or
          # `musllinux_1_2`, built natively on a per-arch runner; ignored on
          # macOS and Windows.
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --manifest-path clients/pytest-mergify/Cargo.toml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-${{ matrix.platform }}
          path: dist/*.whl

  # The source distribution is a fallback for platforms without a wheel: maturin
  # vendors the path-dependency crates + the workspace manifest into the tarball,
  # so `pip install` compiles the binding from source (needs a Rust toolchain).
  # Built once (platform-independent); no compilation, so no manylinux container.
  sdist:
    name: sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stamp the version from the tag
        if: inputs.tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#pytest-mergify-v}"
          sed -i.bak -E "s/^version = \"0.0.0\".*/version = \"${version}\"/" clients/pytest-mergify/pyproject.toml
          rm -f clients/pytest-mergify/pyproject.toml.bak
          grep '^version = ' clients/pytest-mergify/pyproject.toml
      - name: Bundle the root LICENSE into the package
        shell: bash
        run: cp LICENSE clients/pytest-mergify/LICENSE
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist --manifest-path clients/pytest-mergify/Cargo.toml
      # maturin vendors the whole workspace into the sdist, so the LICENSE copied
      # above lands nested under clients/pytest-mergify/ while PKG-INFO (at the
      # sdist root) declares `License-File: LICENSE`; PyPI resolves that path from
      # the sdist root and rejects the upload otherwise (this sank 2026.8.5.1).
      # Move it to the root and drop the nested LICENSE duplicate it vendored, so
      # the tarball carries a single copy. Done with tarfile (not shell tar) to
      # stay portable and free of the AppleDouble members bsdtar would inject.
      - name: Normalize sdist licenses (single LICENSE at root)
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, io, os, tarfile
          sdist = glob.glob("dist/*.tar.gz")[0]
          with tarfile.open(sdist) as t:
              names = t.getnames()
              root = next(n for n in names if n.endswith("/PKG-INFO") and n.count("/") == 1).split("/")[0]
              nested_license = f"{root}/clients/pytest-mergify/LICENSE"
              if f"{root}/LICENSE" in names or nested_license not in names:
                  raise SystemExit(0)  # already normalized / nothing to move
              data = t.extractfile(nested_license).read()
          # Drop the nested LICENSE (the build-time copy maturin vendored); the
          # copy added at the root below is the single canonical one. Keep the
          # nested README -- clients/pytest-mergify/Cargo.toml's `readme` points
          # at it, so building the wheel from this sdist needs it.
          drop = {nested_license}
          tmp = sdist + ".tmp"
          with tarfile.open(sdist) as src, tarfile.open(tmp, "w:gz") as w:
              for m in src.getmembers():
                  if m.name in drop:
                      continue
                  w.addfile(m, src.extractfile(m) if m.isfile() else None)
              info = tarfile.TarInfo(f"{root}/LICENSE")
              info.size = len(data)
              info.mode = 0o644
              w.addfile(info, io.BytesIO(data))
          os.replace(tmp, sdist)
          print(f"normalized: single {root}/LICENSE at root")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
