name: Continuous Integration

permissions: read-all

on:
  pull_request:
    branches:
      - main
      - devs/**

# Cancel superseded runs on the same ref — a new push makes the in-flight
# matrix obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Let abi3 builds proceed against a CPython newer than the one PyO3 knows about
# (e.g. a runner shipping a brand-new 3.x). Safe for abi3 wheels.
env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  rust:
    name: cargo test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  wheel:
    name: build + import wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The wheel now bundles the Rust binding, so it's a compiled abi3
      # extension built with maturin (one wheel per platform, CPython 3.8+).
      - name: Build wheel
        run: uvx maturin build --out dist --manifest-path clients/pytest-mergify/Cargo.toml
      - name: Install and import
        shell: bash
        run: |
          uv venv
          uv pip install "pytest-mergify @ $(ls dist/*.whl)"
          uv run python -c "import pytest_mergify; from pytest_mergify import _mergify_ci; print('imported; provider =', _mergify_ci.detect_provider())"

  tests:
    name: pytest-mergify tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: clients/pytest-mergify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # `uv run` builds the maturin extension (cargo) before the tests; the
      # committed uv.lock pins the known-good dev/runtime deps per Python.
      - name: Run the test suite
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: uv run --frozen poe test

  linters:
    name: pytest-mergify linters
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/pytest-mergify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # `uv run` builds the maturin extension before poe runs the linters.
      - name: Run ruff, mypy, yamllint
        run: uv run --frozen poe linters

  codespell:
    name: pytest-mergify codespell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/pytest-mergify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # codespell runs on 3.14 (its poe task pins UV_PYTHON); `uv run` builds
      # the maturin extension first, then --frozen uses the locked codespell.
      - name: Run codespell
        env:
          UV_PYTHON: "3.14"
        run: uv run --frozen poe codespell

  semgrep:
    name: pytest-mergify semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.176.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Scoped to the client -- upstream scanned its whole repo, which was just
      # the plugin. A repo-wide scan would be a separate monorepo-level job.
      - name: Run Semgrep
        run: semgrep --config=auto --error --timeout=15 clients/pytest-mergify

  ts-linters:
    name: ts linters
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs pnpm as a native binary and the runtime with it, so there is
      # no separate actions/setup-node, and runs the frozen install itself.
      # The version comes from devEngines.runtime in clients/ts/package.json.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          working-directory: clients/ts
          runtime: node
          cache: true
          require-lockfile: true
      - run: pnpm run format:check
      - run: pnpm run eslint
      - run: pnpm run typecheck

  ts-tests:
    name: ts tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: clients/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The matrix drives the runtime here, so this is the one call site that
      # overrides devEngines.runtime -- an explicit version in the input wins.
      # devEngines carries onFail: warn for exactly this: pnpm checks the
      # runtime against it and would otherwise fail the node 22 leg with
      # ERR_PNPM_BAD_RUNTIME_VERSION.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          working-directory: clients/ts
          runtime: node@${{ matrix.node }}
          cache: true
          require-lockfile: true
      # `pnpm -r run build` compiles the @mergifyio/ci-native binding (napi),
      # so the tests exercise the real Rust detection core.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: pnpm -r run build
      - run: pnpm -r test
      # The integration fixtures run a browser-less playwright project, so no
      # `playwright install` is needed.
      - run: pnpm -r test:integration

  ts-codespell:
    name: ts codespell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # Pinned to the same codespell the pytest-mergify side locks in uv.lock.
      # Skips cover local build artifacts too, so the same command works on a
      # developer checkout, not only CI's fresh clone.
      - name: Run codespell
        run: uvx codespell==2.4.3 --skip='*/pnpm-lock.yaml,*/dist,*/node_modules,*.node' clients/ts

  ts-semgrep:
    name: ts semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.176.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Semgrep
        run: semgrep --config=auto --error --timeout=15 clients/ts

  rspec-tests:
    name: rspec-mergify tests (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
    defaults:
      run:
        working-directory: clients/rspec-mergify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The matrix drives the version, not the gem's .ruby-version: that file
      # is the local dev Ruby, while the gemspec promises >= 3.1. Testing the
      # whole declared range is what keeps that promise honest -- pointing this
      # at .ruby-version instead would only ever exercise the newest one.
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: clients/rspec-mergify
      - run: bundle exec rspec

  rspec-rubocop:
    name: rspec-mergify rubocop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/rspec-mergify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Lint once, on the gem's own dev Ruby -- rubocop's findings are driven by
      # .rubocop.yml's TargetRubyVersion, not by the interpreter running it.
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true
          working-directory: clients/rspec-mergify
      - run: bundle exec rubocop

  rspec-codespell:
    name: rspec-mergify codespell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # Same pinned codespell as the other two clients. The skips cover a
      # developer checkout's build output (bundler's vendor/, rake's pkg/) so
      # the command behaves the same locally as on CI's fresh clone.
      - name: Run codespell
        run: uvx codespell==2.4.3 --skip='*/vendor,*/pkg,*/.bundle,*/coverage' clients/rspec-mergify

  rspec-semgrep:
    name: rspec-mergify semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.176.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # avoid-raw is a Rails view rule and cannot apply here: the gem has no
      # Rails dependency, no views and renders no HTML. It fires on the local
      # variable `raw` in resources/jenkins.rb, which holds a branch name read
      # from the environment, mistaking it for Rails' raw() helper. Excluded by
      # rule id rather than a nosemgrep comment so the imported library code
      # stays as upstream wrote it, and so a future `raw` local doesn't reopen
      # this.
      - name: Run Semgrep
        run: |
          semgrep --config=auto --error --timeout=15 \
            --exclude-rule=ruby.rails.security.audit.xss.avoid-raw.avoid-raw \
            clients/rspec-mergify

  rspec-gem:
    name: rspec-mergify gem build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true
          working-directory: clients/rspec-mergify
      # Build the way a release does -- staged, with a throwaway version -- not
      # straight from the working tree. `spec.files` is a glob, so a plain
      # `gem build` here would cheerfully emit a gem with no LICENSE in it and
      # exit 0: the repo keeps its licence at the root, and only the staging
      # step copies it next to the gemspec. Releases are immutable, so a
      # packaging regression has to be caught on the PR, not at the tag.
      - name: Stage the release inputs
        run: .github/scripts/stage-rspec-release.sh rspec-mergify-v0.0.1
      - name: Build and inspect the package
        working-directory: clients/rspec-mergify
        run: |
          bundle exec rake build
          bundle exec ruby -rrubygems/package -e '
            spec = Gem::Package.new(ARGV[0]).spec
            errs = []
            errs << "version is #{spec.version}, expected 0.0.1" unless spec.version.to_s == "0.0.1"
            errs << "licenses are #{spec.licenses.inspect}, expected Apache-2.0" unless spec.licenses == ["Apache-2.0"]
            errs << "LICENSE is not packaged" unless spec.files.include?("LICENSE")
            errs << "README.md is not packaged" unless spec.files.include?("README.md")
            abort "::error::built gem is wrong: #{errs.join("; ")}" unless errs.empty?
            puts "ok: #{spec.name} #{spec.version}, #{spec.licenses.join(", ")}, #{spec.files.size} files packaged"
          ' pkg/rspec-mergify-0.0.1.gem

  ci-gate:
    if: ${{ !cancelled() }}
    needs:
      - rust
      - wheel
      - tests
      - linters
      - codespell
      - semgrep
      - ts-linters
      - ts-tests
      - ts-codespell
      - ts-semgrep
      - rspec-tests
      - rspec-rubocop
      - rspec-codespell
      - rspec-semgrep
      - rspec-gem
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        uses: Mergifyio/gha-mergify-ci@5e8176734bc525c7fd8b2e812f0fa47246f601b7 # v25
        with:
          action: wait-jobs
          jobs: ${{ toJSON(needs) }}
