name: Continuous Integration

permissions: read-all

on:
  pull_request:
    branches:
      - main
      - devs/**

# Cancel superseded runs on the same ref — a new push makes the in-flight
# matrix obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Let abi3 builds proceed against a CPython newer than the one PyO3 knows about
# (e.g. a runner shipping a brand-new 3.x). Safe for abi3 wheels.
env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  rust:
    name: cargo test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  wheel:
    name: build + import wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # The plugin is still pure Python (it doesn't use the bundled Rust binding
      # yet), so this builds a universal wheel with hatchling -- no Rust
      # toolchain, no maturin. Adopting the binding switches this to maturin.
      - name: Build wheel
        run: uv build --wheel --out-dir dist clients/pytest-mergify
      - name: Install and import
        shell: bash
        run: |
          uv venv
          # Direct file reference pins the freshly-built wheel while still
          # resolving pytest-mergify's runtime deps from the index.
          uv pip install "pytest-mergify @ $(ls dist/*.whl)"
          uv run python -c "import pytest_mergify; print('pytest-mergify imported')"

  tests:
    name: pytest-mergify tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: clients/pytest-mergify
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # The committed uv.lock pins the plugin's known-good dev/runtime deps
      # (older otel/ruff/mypy); --frozen installs exactly that set per Python.
      - name: Run the test suite
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: uv run --frozen poe test

  linters:
    name: pytest-mergify linters
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/pytest-mergify
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Run ruff, mypy, yamllint
        run: uv run --frozen poe linters

  codespell:
    name: pytest-mergify codespell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/pytest-mergify
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # codespell runs on 3.14 (its poe task pins UV_PYTHON); --frozen uses the
      # locked codespell.
      - name: Run codespell
        env:
          UV_PYTHON: "3.14"
        run: uv run --frozen poe codespell

  ci-gate:
    if: ${{ !cancelled() }}
    needs:
      - rust
      - wheel
      - tests
      - linters
      - codespell
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        uses: Mergifyio/gha-mergify-ci@f1feee72acd3b001406ff1cc0ce23e6033e26fe7 # v22
        with:
          action: wait-jobs
          jobs: ${{ toJSON(needs) }}
