name: Continuous Integration

permissions: read-all

on:
  pull_request:
    branches:
      - main
      - devs/**

# Cancel superseded runs on the same ref — a new push makes the in-flight
# matrix obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Let abi3 builds proceed against a CPython newer than the one PyO3 knows about
# (e.g. a runner shipping a brand-new 3.x). Safe for abi3 wheels.
env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  rust:
    name: cargo test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  wheel:
    name: build + import wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # The wheel now bundles the Rust binding, so it's a compiled abi3
      # extension built with maturin (one wheel per platform, CPython 3.8+).
      - name: Build wheel
        run: uvx maturin build --out dist --manifest-path clients/pytest-mergify/Cargo.toml
      - name: Install and import
        shell: bash
        run: |
          uv venv
          uv pip install "pytest-mergify @ $(ls dist/*.whl)"
          uv run python -c "import pytest_mergify; from pytest_mergify import _mergify_ci; print('imported; provider =', _mergify_ci.detect_provider())"

  tests:
    name: pytest-mergify tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: clients/pytest-mergify
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # `uv run` builds the maturin extension (cargo) before the tests; the
      # committed uv.lock pins the known-good dev/runtime deps per Python.
      - name: Run the test suite
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: uv run --frozen poe test

  linters:
    name: pytest-mergify linters
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/pytest-mergify
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # `uv run` builds the maturin extension before poe runs the linters.
      - name: Run ruff, mypy, yamllint
        run: uv run --frozen poe linters

  codespell:
    name: pytest-mergify codespell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/pytest-mergify
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # codespell runs on 3.14 (its poe task pins UV_PYTHON); `uv run` builds
      # the maturin extension first, then --frozen uses the locked codespell.
      - name: Run codespell
        env:
          UV_PYTHON: "3.14"
        run: uv run --frozen poe codespell

  semgrep:
    name: pytest-mergify semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.100.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Scoped to the client -- upstream scanned its whole repo, which was just
      # the plugin. A repo-wide scan would be a separate monorepo-level job.
      - name: Run Semgrep
        run: semgrep --config=auto --error --timeout=15 clients/pytest-mergify

  ts-linters:
    name: ts linters
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ts
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: clients/ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: clients/ts/.node-version
          cache: pnpm
          cache-dependency-path: clients/ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run eslint
      - run: pnpm run typecheck

  ts-tests:
    name: ts tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: clients/ts
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: clients/ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: clients/ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      - run: pnpm -r test
      # The integration fixtures run a browser-less playwright project, so no
      # `playwright install` is needed.
      - run: pnpm -r test:integration

  ts-codespell:
    name: ts codespell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # Pinned to the same codespell the pytest-mergify side locks in uv.lock.
      - name: Run codespell
        run: uvx codespell==2.4.3 --skip='*/pnpm-lock.yaml' clients/ts

  ts-semgrep:
    name: ts semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.100.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run Semgrep
        run: semgrep --config=auto --error --timeout=15 clients/ts

  ci-gate:
    if: ${{ !cancelled() }}
    needs:
      - rust
      - wheel
      - tests
      - linters
      - codespell
      - semgrep
      - ts-linters
      - ts-tests
      - ts-codespell
      - ts-semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        uses: Mergifyio/gha-mergify-ci@f1feee72acd3b001406ff1cc0ce23e6033e26fe7 # v22
        with:
          action: wait-jobs
          jobs: ${{ toJSON(needs) }}
