name: Probe npm trusted publishers

# Answers one question that is otherwise unanswerable from outside npm: does
# every package this workspace publishes have a trusted-publisher entry that
# matches this repo, this environment, and the release workflow?
#
# It matters because the setting is per-package and manual -- npm only exposes
# it on a package that already exists, so each new package is configured by
# hand after its first publish (see release-ts.yml). A package that was missed
# fails nothing until the release that needs it, and then fails it with a bare
# 404 halfway through publishing eleven packages.
#
# The probe performs the same token exchange `npm publish` performs
# (npm/lib/utils/oidc.js), and stops there -- it never publishes, never
# uploads, and mutates nothing. A 200 means the publisher is configured and
# matches; a 404 means it is not, and the next release will fail on that
# package.
#
# Run it after adding a package to the workspace, and any time a release fails
# on a 404, to tell "not configured" apart from the transient exchange failures
# that look identical at the console (which is what ts-v0.3.5 hit).
on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    # Both have to match what the packages' trusted-publisher settings name, or
    # the exchange 404s here exactly as it would during a release.
    environment: release
    permissions:
      contents: read # read the package manifests
      id-token: write # request the OIDC token to exchange
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exchange an OIDC token for every published package
        working-directory: clients/ts
        run: |
          # The audience is registry-scoped rather than package-scoped, so one
          # token covers every package below -- and asking once keeps the probe
          # off the ID-token endpoint that a release hits once per package.
          id_token="$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | jq -r .value)"

          # Every package this workspace publishes, read off the committed
          # manifests: the four workspace packages plus one per napi platform.
          # Deriving them means a package added without a publisher shows up
          # here on its own rather than waiting to be added to a list.
          failed=0
          while read -r name; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${id_token}" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${name/\//%2f}")"
            case "${code}" in
              200) echo "ok         ${name}" ;;
              404) echo "::error::no trusted publisher for ${name} (or it does not match this repo/workflow/environment)"
                   failed=1 ;;
              *)   echo "::warning::unexpected HTTP ${code} for ${name} -- inconclusive, not a verdict"
                   failed=1 ;;
            esac
          done < <(jq -r .name packages/*/package.json packages/native/npm/*/package.json | sort)

          exit "${failed}"
