name: Publish pytest-mergify

# The PyPI half of the publish stage of release.yml (see there for the whole
# flow). Publishing the draft fires this, which uploads the wheels the draft
# carries to PyPI via Trusted Publishing (PEP 740 attestations on by default).
# It deliberately does not rebuild: what was reviewed on the draft is what
# reaches the index, byte for byte.
#
# PyPI binds the trusted publisher to THIS workflow filename and the `release`
# environment, so renaming the file is a breaking change.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-pytest-mergify-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    # The `release` environment carries the PyPI Trusted Publishing identity.
    environment: release
    permissions:
      contents: read # read the release assets
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      # Only release.yml creates releases now, and its tags are the bare
      # version; anything else was cut by hand and has no business on PyPI.
      - name: Check the tag is a release version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "${TAG}" =~ ^[0-9]{4}\.(1[0-2]|[1-9])\.[1-9][0-9]*$ ]]; then
            echo "::error::tag '${TAG}' is not a <YYYY>.<M>.<N> release"
            exit 1
          fi
      - name: Download the wheels the draft built
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release download "${TAG}" --repo "${REPO}" --dir dist --pattern '*.whl'
      # The draft stage checked these, but release assets are mutable where a
      # tag is not, so the same assertions run again on what actually came back.
      - name: Check the downloaded contents
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python3 .github/scripts/check-pytest-packages.py dist "${TAG}"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          # The three registries publish from separate jobs, so one can fail
          # while the others succeed; skipping what PyPI already has makes a
          # re-run of this job a recovery rather than a 400.
          skip-existing: true
