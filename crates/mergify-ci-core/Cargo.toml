[package]
name = "mergify-ci-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "CI provider / job-context detection and shared client recipes — the shared source of truth for Mergify test-client integrations."
# Intentionally publishable: keep deps to crates.io-only so this crate can be
# published later for mergify-cli to consume. Do NOT add private Mergify crates.

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The test-collection fingerprint. RustCrypto, pure Rust, no system OpenSSL --
# keeps this crate publishable and the wheels/gems portable. `base16ct` renders
# the digest: since 0.11 `sha2` hands back a `hybrid_array::Array`, which has no
# `LowerHex`, so the hex has to come from somewhere.
base16ct = { version = "1", features = ["alloc"] }
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
